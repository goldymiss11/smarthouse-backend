version: '3.8'
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - DB_URL=${DB_URL}
      - AI_KEY=${AI_KEY}
      - USE_MOCK_AI=${USE_MOCK_AI}
      - MAX_TOKEN=${MAX_TOKEN}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/map/houses"]
      interval: 30s
      timeout: 10s
      retries: 3
